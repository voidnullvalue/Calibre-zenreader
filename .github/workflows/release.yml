name: Release APK

# Tag, build and publish an installable APK on every commit to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to push the tag and create the GitHub release.
permissions:
  contents: write

# Serialise releases so two runs cannot race on the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so tags are available for the release step.
          fetch-depth: 0

      # The project is built with the Java 17 language level (see app/build.gradle).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub-hosted Ubuntu image already ships the Android SDK
      # (ANDROID_HOME=/usr/local/lib/android/sdk) with cmdline-tools,
      # platform-tools, platform android-35 and build-tools 35.0.0. The
      # third-party android-actions/setup-android action is not needed: its v3
      # line is EOL (built for Node 20, now forced onto Node 24) and it always
      # re-downloads a hardcoded cmdline-tools archive when the preinstalled
      # revision differs from its 12266719 default, which is what failed the
      # first run. Resolve sdkmanager from the image instead.
      - name: Locate Android SDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "${sdk_root}" ]; then
            echo "::error::No Android SDK found at ${sdk_root}"
            exit 1
          fi
          sdkmanager=$(command -v sdkmanager || true)
          if [ -z "${sdkmanager}" ]; then
            sdkmanager=$(find "${sdk_root}/cmdline-tools" "${sdk_root}/tools" \
              -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "${sdkmanager}" ]; then
            echo "::error::sdkmanager not found under ${sdk_root}"
            exit 1
          fi
          echo "ANDROID_HOME=${sdk_root}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${sdk_root}" >> "$GITHUB_ENV"
          echo "$(dirname "${sdkmanager}")" >> "$GITHUB_PATH"
          echo "Using sdkmanager: ${sdkmanager}"
          "${sdkmanager}" --version

      # compileSdk/targetSdk 35 per app/build.gradle. Install only what the image
      # does not already provide, so a read-only SDK root cannot fail the job.
      - name: Install Android platform and build-tools
        run: |
          set -euo pipefail
          missing=()
          [ -d "${ANDROID_HOME}/platforms/android-35" ] || missing+=("platforms;android-35")
          [ -d "${ANDROID_HOME}/build-tools/35.0.0" ] || missing+=("build-tools;35.0.0")
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "platforms;android-35 and build-tools;35.0.0 are already installed."
            exit 0
          fi
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "${missing[@]}"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Tests first: never tag a broken commit.
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Derive version and tag
        id: version
        run: |
          set -euo pipefail
          version_name=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          tag="v${version_name}-build.${{ github.run_number }}"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} (versionName ${version_name})"

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Align and sign APK
        env:
          # Optional: provide these repository secrets to sign with your own key.
          # Without them a throw-away CI key is generated so the APK stays installable.
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          build_tools=$(dirname "$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)")
          unsigned=$(find app/build/outputs/apk/release -maxdepth 1 -name '*unsigned*.apk' | head -1)
          [ -n "${unsigned}" ] || unsigned=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          aligned="app/build/outputs/apk/release/aligned.apk"
          signed="app/build/outputs/apk/release/calibreader-${{ steps.version.outputs.tag }}.apk"

          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "Using provided release keystore."
            printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 -d > release.keystore
            store_pass="${RELEASE_KEYSTORE_PASSWORD}"
            key_alias="${RELEASE_KEY_ALIAS}"
            key_pass="${RELEASE_KEY_PASSWORD:-${RELEASE_KEYSTORE_PASSWORD}}"
          else
            echo "No release keystore configured; generating a throw-away CI keystore."
            keytool -genkeypair -keystore release.keystore \
              -storepass calibreader -keypass calibreader -alias calibreader \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CalibReader CI, O=CalibReader" >/dev/null
            store_pass="calibreader"
            key_alias="calibreader"
            key_pass="calibreader"
          fi

          "${build_tools}/zipalign" -p -f 4 "${unsigned}" "${aligned}"
          "${build_tools}/apksigner" sign \
            --ks release.keystore \
            --ks-pass "pass:${store_pass}" \
            --ks-key-alias "${key_alias}" \
            --key-pass "pass:${key_pass}" \
            --out "${signed}" "${aligned}"
          "${build_tools}/apksigner" verify --verbose "${signed}"

          echo "APK_PATH=${signed}" >> "$GITHUB_ENV"
          echo "APK_NAME=calibreader-${{ steps.version.outputs.tag }}.apk" >> "$GITHUB_ENV"

      - name: Create and push tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; reusing it."
          else
            git tag -a "${tag}" -m "CalibReader ${tag}"
            git push origin "${tag}"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${APK_PATH}#${APK_NAME}" --clobber
          else
            gh release create "${tag}" "${APK_PATH}#${APK_NAME}" \
              --title "CalibReader ${tag}" \
              --notes "Automated APK release for commit ${GITHUB_SHA} on main." \
              --target "${GITHUB_SHA}"
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: calibreader-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
